name: Update claude-export branch

on:
  push:
    branches:
      - main
    paths:
      - ".claude/**"

jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Split and push claude-export
        run: |
          git branch -D claude-export 2>/dev/null || true
          git subtree split --prefix=.claude -b claude-export
          git push origin claude-export --force
